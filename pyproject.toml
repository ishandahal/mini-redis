[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-redis"
version = "0.1.0"
description = "A Redis-inspired server built to learn backend and systems engineering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mini-redis = "mini_redis.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_redis"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
